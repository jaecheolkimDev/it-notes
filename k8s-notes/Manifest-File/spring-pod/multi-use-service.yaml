# Service 이름을 키값으로 로드밸런싱을 수행한다.
# selector를 사용하여 레이블 비교하여 트래픽을 보낼 파드들을 구분한다.

apiVersion: v1
kind: Service

# Service 기본 정보
metadata:
  name: spring-service # Service 이름
#  # MYSQL
#  name: mysql-service # Service 이름
#  # NGINX
#  name: nginx-service # Service 이름

# Service 세부 정보
spec:
#  # 보안 이슈때문에 사용하지 않음
#  type: NodePort # Service의 종류
  type: ClusterIP  # Service의 종류
  selector:
    app: backend-app # 실행되고 있는 파드 중 'app: backend-app'이라는 값을 가진 파드와 서비스를 연결
#    # MYSQL
#    app: mysql-db # 실행되고 있는 파드 중 'app: mysql-db'이라는 값을 가진 파드와 서비스를 연결
#    # NGINX
#    app: nginx # 실행되고 있는 파드 중 'app: nginx'이라는 값을 가진 파드와 서비스를 연결
  ports:
    - protocol: TCP # 서비스에 접속하기 위한 프로토콜
      port: 8080 # 쿠버네티스 내부에서 Service에 접속하기 위한 포트 번호
      targetPort: 8080 # 매핑하기 위한 파드의 포트 번호
      nodePort: 30000 # 외부에서 사용자들이 접근하게 될 포트 번호 (보안 이슈때문에 사용하지 않음)
#      # MYSQL
#      port: 3306 # 쿠버네티스 내부에서 Service에 접속하기 위한 포트 번호
#      targetPort: 3306 # 매핑하기 위한 파드의 포트 번호
#      nodePort: 30002 # 외부에서 사용자들이 접근하게 될 포트 번호 (보안 이슈때문에 사용하지 않음)
#      # NGINX
#      port: 80 # 쿠버네티스 내부에서 Service에 접속하기 위한 포트 번호
#      targetPort: 80 # 매핑하기 위한 파드의 포트 번호
#      nodePort: 30000 # 외부에서 사용자들이 접근하게 될 포트 번호